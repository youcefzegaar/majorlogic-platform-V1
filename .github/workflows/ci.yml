name: MajorLogic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Security Audit
        run: npm audit --audit-level=high

  build-ui:
    name: Build UI Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Admin UI
        run: npm run build
        working-directory: apps/admin-ui
        env:
          NODE_ENV: production

      - name: Build Search UI
        run: npm run build
        working-directory: apps/search-ui
        env:
          NODE_ENV: production

  unit-tests:
    name: Unit Tests (vitest)
    runs-on: ubuntu-latest
    needs: [lint-and-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-audit, unit-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: majorlogic_test
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/majorlogic_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      COOKIE_SECRET: ci-test-cookie-secret-not-for-production
      ADMIN_EXPORT_SECRET: ci-test-export-secret
      ADMIN_USER: admin
      ADMIN_PASSWORD_HASH: $2b$10$placeholder.hash.for.ci.only

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Database Migrations
        run: node scripts/db-migrate.js

      - name: Run Regression Tests
        run: node tests/regression-v1.test.js

      - name: Run System Tests
        run: node tests/system.test.js
